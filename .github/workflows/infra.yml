name: infra
on:
  pull_request:
    paths: ["infrastructure/terraform/**", ".github/workflows/infra.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infrastructure/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check
      - name: Validate staging (no backend, no credentials)
        working-directory: infrastructure/terraform/envs/staging
        run: terraform init -backend=false && terraform validate
