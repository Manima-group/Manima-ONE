[project]
name = "manima-api"
version = "0.1.0"
description = "Manima One API — modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery>=5.4",
  "redis>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manima"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S105", "S106", "B904", "S608"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # formatter wraps code at 110; long literal strings may run to 120

[tool.ruff.lint.per-file-ignores]
"src/manima/migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
